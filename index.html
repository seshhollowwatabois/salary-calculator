<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0b0f19">
  <link rel="manifest" href="manifest.webmanifest">

  <title>Salary Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
      position: relative;
    }

    /* Language button */

    .language-button {
      position: absolute;
      top: 0;
      right: 0;
      border: none;
      border-radius: 10px;
      padding: 7px 10px;
      background: #222a3b;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }

    .language-button:active {
      transform: scale(0.96);
    }

    h1 {
      text-align: center;
      margin: 0 0 20px;
      padding-top: 4px;
      font-size: 28px;
    }

    .card {
      background: #151b29;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #222a3b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      box-shadow: 0 0 0 2px #009DE0;
    }

    .months {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .months button {
      border: none;
      border-radius: 12px;
      padding: 12px 6px;
      background: #222a3b;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s;
    }

    .months button.active {
      background: #009DE0;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(0, 157, 224, 0.35);
      font-weight: 600;
    }

    .months button.active::before {
      content: "W";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      margin-right: 6px;
      border-radius: 50%;
      background: #ffffff;
      color: #009DE0;
      font-weight: 800;
      font-size: 12px;
      vertical-align: middle;
    }

    .extra-row {
      margin-bottom: 14px;
    }

    .extra-row:last-child {
      margin-bottom: 0;
    }

    .clear-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #2b3448;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .clear-btn:active {
      transform: scale(0.98);
    }

    .summary {
      display: grid;
      gap: 10px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-total {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid #30394d;
      font-size: 20px;
      font-weight: 700;
    }

    .month-result {
      background: #151b29;
      border-radius: 18px;
      padding: 18px;
    }

    .month-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 8px 0;
    }

    .hourly-row {
      color: #009DE0;
      font-weight: 600;
    }

    .result-total {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid #30394d;
      font-weight: 700;
      font-size: 18px;
    }

    @media (max-width: 400px) {
      body {
        padding: 14px;
      }

      h1 {
        font-size: 25px;
      }

      .language-button {
        font-size: 12px;
        padding: 6px 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- Language switcher -->
  <button
    id="languageButton"
    class="language-button"
    onclick="toggleLanguage()">
    🇬🇪 ქართული
  </button>

  <h1 id="title">💰 Salary Calculator</h1>


  <!-- Salary -->

  <div class="card">

    <label
      class="label"
      id="salaryLabel"
      for="salary">
      Base Salary
    </label>

    <select id="salary">
      <option value="1300">1300 GEL</option>
      <option value="1435">1435 GEL</option>
      <option value="1800">1800 GEL</option>
    </select>

  </div>


  <!-- Month -->

  <div class="card">

    <div
      class="label"
      id="monthLabel">
      Select Month
    </div>

    <div
      class="months"
      id="months">
    </div>

  </div>


  <!-- Extra hours -->

  <div class="card">

    <div class="extra-row">

      <label
        class="label"
        id="overtimeLabel"
        for="overtime">
        ⏱️ Overtime ×2
      </label>

      <input
        id="overtime"
        type="number"
        inputmode="decimal"
        value="0"
        min="0">

    </div>


    <div class="extra-row">

      <label
        class="label"
        id="nightLabel"
        for="night">
        🌙 Night Addition ×1.4
      </label>

      <input
        id="night"
        type="number"
        inputmode="decimal"
        value="0"
        min="0">

    </div>


    <div class="extra-row">

      <label
        class="label"
        id="holidayLabel"
        for="holiday">
        🏖️ Bank Holiday ×1.25
      </label>

      <input
        id="holiday"
        type="number"
        inputmode="decimal"
        value="0"
        min="0">

    </div>


    <div class="extra-row">

      <label
        class="label"
        id="holidayNightLabel"
        for="holidayNight">
        🌙🏖️ Bank Holiday Night ×1.5
      </label>

      <input
        id="holidayNight"
        type="number"
        inputmode="decimal"
        value="0"
        min="0">

    </div>


    <button
      class="clear-btn"
      id="clearButton"
      onclick="clearHours()">
      Clear Hours
    </button>

  </div>


  <!-- Summary -->

  <div class="card">

    <div class="summary">

      <div class="summary-row">

        <span id="summaryBaseLabel">
          Base salary
        </span>

        <span id="summaryBase">
          0.00 GEL
        </span>

      </div>


      <div class="summary-row">

        <span id="summaryExtraLabel">
          Extra pay
        </span>

        <span id="summaryExtra">
          0.00 GEL
        </span>

      </div>


      <div class="summary-row summary-total">

        <span id="summaryTotalLabel">
          Gross total
        </span>

        <span id="summaryTotal">
          0.00 GEL
        </span>

      </div>

    </div>

  </div>


  <!-- Results -->

  <div id="results"></div>

</div>


<script>

/* =========================================
   LANGUAGE
========================================= */

const translations = {

  en: {

    languageButton: "🇬🇪 ქართული",

    title: "💰 Salary Calculator",

    baseSalary: "Base Salary",

    selectMonth: "Select Month",

    overtime: "⏱️ Overtime ×2",

    night: "🌙 Night Addition ×1.4",

    holiday: "🏖️ Bank Holiday ×1.25",

    holidayNight: "🌙🏖️ Bank Holiday Night ×1.5",

    clearHours: "Clear Hours",

    summaryBase: "Base salary",

    summaryExtra: "Extra pay",

    summaryTotal: "Gross total",

    scheduledHours: "📅 Scheduled hours",

    hourlySalary: "💰 Hourly salary"

  },


  ka: {

    languageButton: "🇬🇧 English",

    title: "💰 ხელფასის კალკულატორი",

    baseSalary: "ძირითადი ხელფასი",

    selectMonth: "აირჩიეთ თვე",

    overtime: "⏱️ ზეგანაკვეთური ×2",

    night: "🌙 ღამის დანამატი ×1.4",

    holiday: "🏖️ სადღესასწაულო დღე ×1.25",

    holidayNight: "🌙🏖️ სადღესასწაულო ღამის ×1.5",

    clearHours: "საათების გასუფთავება",

    summaryBase: "ძირითადი ხელფასი",

    summaryExtra: "დამატებითი ანაზღაურება",

    summaryTotal: "მთლიანი ხელფასი",

    scheduledHours: "📅 დაგეგმილი საათები",

    hourlySalary: "💰 საათობრივი ხელფასი"

  }

};


/* =========================================
   MONTH NAMES
========================================= */

const monthNames = {

  en: [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
  ],

  ka: [
    "იანვარი",
    "თებერვალი",
    "მარტი",
    "აპრილი",
    "მაისი",
    "ივნისი",
    "ივლისი",
    "აგვისტო",
    "სექტემბერი",
    "ოქტომბერი",
    "ნოემბერი",
    "დეკემბერი"
  ]

};


/* =========================================
   SCHEDULED HOURS
========================================= */

const scheduledHours = [

  168,
  160,
  184,
  176,
  168,
  176,
  176,
  176,
  176,
  168,
  176,
  184

];


/* =========================================
   LANGUAGE STORAGE
========================================= */

let currentLanguage =
  localStorage.getItem("salaryCalculatorLanguage") || "en";


/* =========================================
   SELECTED MONTH
========================================= */

let selectedMonth = null;


/* =========================================
   CREATE MONTH BUTTONS
========================================= */

const monthsContainer =
  document.getElementById("months");


function createMonthButtons() {

  monthsContainer.innerHTML = "";

  monthNames[currentLanguage].forEach(
    (month, index) => {

      const button =
        document.createElement("button");

      button.textContent =
        month.slice(0, 3);

      button.id =
        "month-" + index;

      button.addEventListener(
        "click",
        () => {
          toggleMonth(index);
        }
      );

      monthsContainer.appendChild(button);

    }
  );

}


/* =========================================
   MONTH SELECTION
========================================= */

function toggleMonth(index) {

  if (selectedMonth === index) {

    selectedMonth = null;

  } else {

    selectedMonth = index;

  }

  update();

}


/* =========================================
   LANGUAGE SWITCH
========================================= */

function toggleLanguage() {

  if (currentLanguage === "en") {

    currentLanguage = "ka";

  } else {

    currentLanguage = "en";

  }


  localStorage.setItem(
    "salaryCalculatorLanguage",
    currentLanguage
  );


  applyLanguage();

  update();

}


/* =========================================
   APPLY LANGUAGE
========================================= */

function applyLanguage() {

  const t =
    translations[currentLanguage];


  document.documentElement.lang =
    currentLanguage === "ka"
      ? "ka"
      : "en";


  document.getElementById(
    "languageButton"
  ).textContent =
    t.languageButton;


  document.getElementById(
    "title"
  ).textContent =
    t.title;


  document.getElementById(
    "salaryLabel"
  ).textContent =
    t.baseSalary;


  document.getElementById(
    "monthLabel"
  ).textContent =
    t.selectMonth;


  document.getElementById(
    "overtimeLabel"
  ).textContent =
    t.overtime;


  document.getElementById(
    "nightLabel"
  ).textContent =
    t.night;


  document.getElementById(
    "holidayLabel"
  ).textContent =
    t.holiday;


  document.getElementById(
    "holidayNightLabel"
  ).textContent =
    t.holidayNight;


  document.getElementById(
    "clearButton"
  ).textContent =
    t.clearHours;


  document.getElementById(
    "summaryBaseLabel"
  ).textContent =
    t.summaryBase;


  document.getElementById(
    "summaryExtraLabel"
  ).textContent =
    t.summaryExtra;


  document.getElementById(
    "summaryTotalLabel"
  ).textContent =
    t.summaryTotal;


  createMonthButtons();

}


/* =========================================
   CLEAR HOURS
========================================= */

function clearHours() {

  document.getElementById(
    "overtime"
  ).value = 0;


  document.getElementById(
    "night"
  ).value = 0;


  document.getElementById(
    "holiday"
  ).value = 0;


  document.getElementById(
    "holidayNight"
  ).value = 0;


  update();

}


/* =========================================
   ZERO DISAPPEARING BEHAVIOR
========================================= */

document.querySelectorAll(
  "#overtime, #night, #holiday, #holidayNight"
).forEach(input => {


  input.addEventListener(
    "focus",
    function() {

      if (this.value === "0") {

        this.value = "";

      }

    }
  );


  input.addEventListener(
    "blur",
    function() {

      if (this.value === "") {

        this.value = "0";

      }

      update();

    }
  );

});


/* =========================================
   UPDATE WHILE TYPING
========================================= */

document
  .querySelectorAll("input, select")
  .forEach(element => {

    element.addEventListener(
      "input",
      update
    );

    element.addEventListener(
      "change",
      update
    );

  });


/* =========================================
   MONEY FORMAT
========================================= */

function money(value) {

  return value.toFixed(2) + " GEL";

}


/* =========================================
   MAIN CALCULATION
========================================= */

function update() {

  const salary =
    Number(
      document.getElementById("salary").value
    ) || 0;


  const overtime =
    Number(
      document.getElementById("overtime").value
    ) || 0;


  const night =
    Number(
      document.getElementById("night").value
    ) || 0;


  const holiday =
    Number(
      document.getElementById("holiday").value
    ) || 0;


  const holidayNight =
    Number(
      document.getElementById("holidayNight").value
    ) || 0;


  /* Update active month */

  document
    .querySelectorAll(".months button")
    .forEach((button, index) => {

      button.classList.toggle(
        "active",
        selectedMonth === index
      );

    });


  /* No month selected */

  if (selectedMonth === null) {

    document.getElementById(
      "summaryBase"
    ).textContent =
      "0.00 GEL";


    document.getElementById(
      "summaryExtra"
    ).textContent =
      "0.00 GEL";


    document.getElementById(
      "summaryTotal"
    ).textContent =
      "0.00 GEL";


    document.getElementById(
      "results"
    ).innerHTML = "";


    return;

  }


  /* Selected month's hours */

  const monthHours =
    scheduledHours[selectedMonth];


  /* Hourly salary */

  const hourlySalary =
    salary / monthHours;


  /* Extra payments */

  const overtimePay =
    hourlySalary * overtime * 2;


  const nightPay =
    hourlySalary * night * 1.4;


  const holidayPay =
    hourlySalary * holiday * 1.25;


  const holidayNightPay =
    hourlySalary * holidayNight * 1.5;


  const extra =
    overtimePay +
    nightPay +
    holidayPay +
    holidayNightPay;


  const total =
    salary + extra;


  /* Summary */

  document.getElementById(
    "summaryBase"
  ).textContent =
    money(salary);


  document.getElementById(
    "summaryExtra"
  ).textContent =
    money(extra);


  document.getElementById(
    "summaryTotal"
  ).textContent =
    money(total);


  /* Translation */

  const t =
    translations[currentLanguage];


  const month =
    monthNames[currentLanguage][selectedMonth];


  /* Detailed result */

  document.getElementById(
    "results"
  ).innerHTML = `

    <div class="month-result">

      <div class="month-title">
        ${month}
      </div>

      <div class="result-row">

        <span>
          ${t.scheduledHours}
        </span>

        <span>
          ${monthHours} h
        </span>

      </div>


      <div class="result-row hourly-row">

        <span>
          ${t.hourlySalary}
        </span>

        <span>
          ${money(hourlySalary)} / h
        </span>

      </div>


      <div class="result-row">

        <span>
          ${t.summaryBase}
        </span>

        <span>
          ${money(salary)}
        </span>

      </div>


      <div class="result-row">

        <span>
          ${t.summaryExtra}
        </span>

        <span>
          ${money(extra)}
        </span>

      </div>


      <div class="result-row result-total">

        <span>
          ${t.summaryTotal}
        </span>

        <span>
          ${money(total)}
        </span>

      </div>

    </div>

  `;

}


/* =========================================
   START APP
========================================= */

applyLanguage();

update();

</script>

</body>
</html>
