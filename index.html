<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#111827">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <link rel="manifest" href="manifest.webmanifest">

  <title>Salary Calculator</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #0b0f19;
    }

    body {
      margin: 0;

      padding:
        max(16px, env(safe-area-inset-top))
        16px
        max(20px, env(safe-area-inset-bottom))
        16px;

      background: #0b0f19;
      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overscroll-behavior-y: none;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;

      margin-bottom: 18px;

      min-width: 0;
    }


    h1 {
      margin: 0;

      font-size: clamp(20px, 5.5vw, 28px);

      line-height: 1.15;

      font-weight: 800;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      flex: 1;

      min-width: 0;
    }


    /* Smaller Georgian title */

    html[lang="ka"] h1 {
      font-size: clamp(18px, 4.8vw, 25px);
    }


    /* =========================
       LANGUAGE BUTTON
    ========================= */

    .language-button {
      flex: 0 0 auto;

      width: 44px;
      height: 44px;

      border: none;

      border-radius: 14px;

      background: #151b29;

      color: white;

      font-size: 21px;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      touch-action: manipulation;

      transition:
        transform 0.15s ease,
        background 0.2s ease;
    }


    .language-button:active {
      transform: scale(0.9);
    }


    /* Language animation */

    .language-button.animate {
      animation:
        languageSwitch
        0.55s
        cubic-bezier(.34, 1.56, .64, 1);
    }


    @keyframes languageSwitch {

      0% {
        transform: scale(1) rotate(0deg);
      }

      25% {
        transform: scale(0.78) rotate(-12deg);
      }

      55% {
        transform: scale(1.18) rotate(12deg);
      }

      80% {
        transform: scale(0.96) rotate(-4deg);
      }

      100% {
        transform: scale(1) rotate(0deg);
      }

    }


    /* =========================
       CARDS
    ========================= */

    .card {
      background: #151b29;

      border-radius: 20px;

      padding: 18px;

      margin-bottom: 14px;
    }


    .label {
      display: block;

      margin-bottom: 9px;

      font-size: 14px;

      font-weight: 600;

      color: #aeb7c7;
    }


    /* =========================
       SELECT
    ========================= */

    select {
      width: 100%;

      height: 48px;

      border: 1px solid #283244;

      border-radius: 13px;

      padding: 0 14px;

      background: #0f1522;

      color: white;

      font-size: 16px;

      outline: none;

      -webkit-appearance: none;

      appearance: none;
    }


    select:focus {
      border-color: #009de0;
    }


    /* =========================
       MONTHS
    ========================= */

    .month-title {
      margin-bottom: 12px;
    }


    .months {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 8px;
    }


    .month {
      position: relative;

      min-height: 48px;

      border: none;

      border-radius: 13px;

      background: #0f1522;

      color: #cbd3df;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      touch-action: manipulation;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.12s ease;
    }


    .month:active {
      transform: scale(0.95);
    }


    .month.selected {
      background: #009de0;

      color: white;
    }


    .month.selected::before {
      content: "W";

      position: absolute;

      top: 5px;

      left: 5px;

      width: 19px;

      height: 19px;

      border-radius: 50%;

      background: white;

      color: #009de0;

      font-size: 11px;

      font-weight: 900;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    /* =========================
       HOURS
    ========================= */

    .hours-grid {
      display: grid;

      gap: 12px;
    }


    .hour-row {
      display: flex;

      flex-direction: column;

      gap: 7px;
    }


    .hour-row label {
      color: #cbd3df;

      font-size: 14px;

      font-weight: 600;
    }


    input[type="number"] {
      width: 100%;

      height: 48px;

      border: 1px solid #283244;

      border-radius: 13px;

      background: #0f1522;

      color: white;

      padding: 0 14px;

      font-size: 17px;

      outline: none;

      -webkit-appearance: none;

      appearance: none;
    }


    input[type="number"]:focus {
      border-color: #009de0;
    }


    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }


    /* =========================
       CLEAR BUTTON
    ========================= */

    .clear-button {
      width: 100%;

      height: 48px;

      margin-top: 14px;

      border: none;

      border-radius: 13px;

      background: #283244;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      touch-action: manipulation;

      transition:
        transform 0.12s ease,
        background 0.2s ease;
    }


    .clear-button:active {
      transform: scale(0.97);

      background: #344158;
    }


    /* =========================
       SUMMARY
    ========================= */

    .summary {
      display: grid;

      gap: 10px;
    }


    .summary-row {
      display: flex;

      justify-content: space-between;

      align-items: center;

      padding-bottom: 9px;

      border-bottom: 1px solid #252e3e;

      gap: 15px;
    }


    .summary-row:last-child {
      border-bottom: none;

      padding-bottom: 0;
    }


    .summary-label {
      color: #aeb7c7;

      font-size: 14px;
    }


    .summary-value {
      font-weight: 700;

      text-align: right;

      white-space: nowrap;
    }


    .summary-total {
      margin-top: 4px;

      padding-top: 13px;

      border-top: 1px solid #303a4d;
    }


    .summary-total .summary-label {
      color: white;

      font-size: 15px;

      font-weight: 700;
    }


    .summary-total .summary-value {
      color: #009de0;

      font-size: 20px;
    }


    /* =========================
       BREAKDOWN
    ========================= */

    .breakdown-title {
      margin: 0 0 14px;

      font-size: 17px;

      font-weight: 800;
    }


    .info-grid {
      display: grid;

      gap: 10px;
    }


    .info-row {
      display: flex;

      justify-content: space-between;

      gap: 15px;

      color: #aeb7c7;

      font-size: 14px;
    }


    .info-row strong {
      color: white;

      text-align: right;

      white-space: nowrap;
    }


    .breakdown {
      margin-top: 18px;

      padding-top: 16px;

      border-top: 1px solid #303a4d;
    }


    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 380px) {

      body {
        padding-left: 12px;

        padding-right: 12px;
      }


      .card {
        padding: 15px;
      }


      h1 {
        font-size: 20px;
      }


      html[lang="ka"] h1 {
        font-size: 17px;
      }


      .language-button {
        width: 40px;

        height: 40px;

        font-size: 19px;
      }


      .month {
        font-size: 12px;
      }

    }

  </style>

</head>


<body>

  <div class="container">


    <!-- HEADER -->

    <div class="header">

      <h1 id="title">
        Salary Calculator 🍏
      </h1>

      <button
        class="language-button"
        id="languageButton"
        aria-label="Change language"
      >
        🇬🇪
      </button>

    </div>


    <!-- SALARY -->

    <div class="card">

      <label
        class="label"
        id="baseSalaryLabel"
      >
        Base Salary
      </label>


      <select id="salary">

        <option value="1300">
          1300 GEL
        </option>

        <option value="1435">
          1435 GEL
        </option>

        <option value="1800">
          1800 GEL
        </option>

      </select>

    </div>


    <!-- MONTH -->

    <div class="card">

      <label
        class="label month-title"
        id="monthLabel"
      >
        Select Month
      </label>


      <div
        class="months"
        id="months"
      ></div>

    </div>


    <!-- EXTRA HOURS -->

    <div class="card">

      <div class="hours-grid">


        <div class="hour-row">

          <label
            for="overtime"
            id="overtimeLabel"
          >
            ⏱️ Overtime ×2
          </label>

          <input
            id="overtime"
            type="number"
            min="0"
            step="0.5"
            value="0"
            inputmode="decimal"
          >

        </div>


        <div class="hour-row">

          <label
            for="night"
            id="nightLabel"
          >
            🌙 Night Addition ×1.4
          </label>

          <input
            id="night"
            type="number"
            min="0"
            step="0.5"
            value="0"
            inputmode="decimal"
          >

        </div>


        <div class="hour-row">

          <label
            for="holiday"
            id="holidayLabel"
          >
            🏖️ Bank Holiday ×1.25
          </label>

          <input
            id="holiday"
            type="number"
            min="0"
            step="0.5"
            value="0"
            inputmode="decimal"
          >

        </div>


        <div class="hour-row">

          <label
            for="holidayNight"
            id="holidayNightLabel"
          >
            🌙🏖️ Bank Holiday Night ×1.5
          </label>

          <input
            id="holidayNight"
            type="number"
            min="0"
            step="0.5"
            value="0"
            inputmode="decimal"
          >

        </div>


      </div>


      <button
        class="clear-button"
        id="clearButton"
      >
        Clear Hours
      </button>

    </div>


    <!-- SUMMARY -->

    <div class="card">

      <div class="summary">


        <div class="summary-row">

          <span
            class="summary-label"
            id="summaryBase"
          >
            Base salary
          </span>

          <span
            class="summary-value"
            id="baseValue"
          >
            1300.00 GEL
          </span>

        </div>


        <div class="summary-row">

          <span
            class="summary-label"
            id="summaryExtra"
          >
            Extra pay
          </span>

          <span
            class="summary-value"
            id="extraValue"
          >
            0.00 GEL
          </span>

        </div>


        <div class="summary-row summary-total">

          <span
            class="summary-label"
            id="summaryTotal"
          >
            Gross total
          </span>

          <span
            class="summary-value"
            id="totalValue"
          >
            1300.00 GEL
          </span>

        </div>


      </div>

    </div>


    <!-- DETAILED BREAKDOWN -->

    <div class="card">

      <h2
        class="breakdown-title"
        id="breakdownTitle"
      >
        📊 Pay Breakdown
      </h2>


      <div class="info-grid">


        <div class="info-row">

          <span id="scheduledHoursLabel">
            📅 Scheduled hours
          </span>

          <strong id="scheduledHoursValue">
            —
          </strong>

        </div>


        <div class="info-row">

          <span id="hourlySalaryLabel">
            💰 Hourly salary
          </span>

          <strong id="hourlySalaryValue">
            —
          </strong>

        </div>


      </div>


      <div class="breakdown">

        <div class="info-grid">


          <div class="info-row">

            <span id="overtimePayLabel">
              ⏱️ Overtime
            </span>

            <strong id="overtimePayValue">
              0.00 GEL
            </strong>

          </div>


          <div class="info-row">

            <span id="nightPayLabel">
              🌙 Night Addition
            </span>

            <strong id="nightPayValue">
              0.00 GEL
            </strong>

          </div>


          <div class="info-row">

            <span id="holidayPayLabel">
              🏖️ Bank Holiday
            </span>

            <strong id="holidayPayValue">
              0.00 GEL
            </strong>

          </div>


          <div class="info-row">

            <span id="holidayNightPayLabel">
              🌙🏖️ Bank Holiday Night
            </span>

            <strong id="holidayNightPayValue">
              0.00 GEL
            </strong>

          </div>


          <div class="info-row">

            <span id="extraTotalLabel">
              Extra Pay
            </span>

            <strong id="extraTotalValue">
              0.00 GEL
            </strong>

          </div>


        </div>

      </div>

    </div>


  </div>


  <script>


    /* =========================
       TRANSLATIONS
    ========================= */

    const translations = {

      en: {

        languageButton: "🇬🇪",

        title: "Salary Calculator 🍏",

        baseSalary: "Base Salary",

        selectMonth: "Select Month",

        overtime:
          "⏱️ Overtime ×2",

        night:
          "🌙 Night Addition ×1.4",

        holiday:
          "🏖️ Bank Holiday ×1.25",

        holidayNight:
          "🌙🏖️ Bank Holiday Night ×1.5",

        clearHours:
          "Clear Hours",

        summaryBase:
          "Base salary",

        summaryExtra:
          "Extra pay",

        summaryTotal:
          "Gross total",

        scheduledHours:
          "📅 Scheduled hours",

        hourlySalary:
          "💰 Hourly salary",

        breakdown:
          "📊 Pay Breakdown",

        overtimePay:
          "⏱️ Overtime",

        nightPay:
          "🌙 Night Addition",

        holidayPay:
          "🏖️ Bank Holiday",

        holidayNightPay:
          "🌙🏖️ Bank Holiday Night",

        extraTotal:
          "Extra Pay"

      },


      ka: {

        languageButton: "🇬🇧",

        title:
          "ხელფასის კალკულატორი 🍏",

        baseSalary:
          "ძირითადი ხელფასი",

        selectMonth:
          "აირჩიეთ თვე",

        overtime:
          "⏱️ ზეგანაკვეთური ×2",

        night:
          "🌙 ღამის დანამატი ×1.4",

        holiday:
          "🏖️ სადღესასწაულო დღე ×1.25",

        holidayNight:
          "🌙🏖️ სადღესასწაულო ღამის ×1.5",

        clearHours:
          "საათების გასუფთავება",

        summaryBase:
          "ძირითადი ხელფასი",

        summaryExtra:
          "დამატებითი ანაზღაურება",

        summaryTotal:
          "მთლიანი ხელფასი",

        scheduledHours:
          "📅 დაგეგმილი საათები",

        hourlySalary:
          "💰 საათობრივი ხელფასი",

        breakdown:
          "📊 ანაზღაურების დეტალური გაშლა",

        overtimePay:
          "⏱️ ზეგანაკვეთური",

        nightPay:
          "🌙 ღამის დანამატი",

        holidayPay:
          "🏖️ სადღესასწაულო დღე",

        holidayNightPay:
          "🌙🏖️ სადღესასწაულო ღამის",

        extraTotal:
          "დამატებითი ანაზღაურება"

      }

    };


    /* =========================
       SHORT MONTH NAMES
    ========================= */

    const monthNames = {

      en: [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec"
      ],


      ka: [
        "იან",
        "თებ",
        "მარ",
        "აპრ",
        "მაი",
        "ივნ",
        "ივლ",
        "აგვ",
        "სექ",
        "ოქტ",
        "ნოე",
        "დეკ"
      ]

    };


    /* =========================
       2026 HOURS
    ========================= */

    const scheduledHours = [

      168, // January
      160, // February
      184, // March
      176, // April
      168, // May
      176, // June
      176, // July
      176, // August
      176, // September
      168, // October
      176, // November
      184  // December

    ];


    /* =========================
       STATE
    ========================= */

    let currentLanguage =
      localStorage.getItem(
        "salaryCalculatorLanguage"
      ) || "en";


    let selectedMonth = null;


    /* =========================
       ELEMENTS
    ========================= */

    const salaryInput =
      document.getElementById("salary");

    const overtimeInput =
      document.getElementById("overtime");

    const nightInput =
      document.getElementById("night");

    const holidayInput =
      document.getElementById("holiday");

    const holidayNightInput =
      document.getElementById("holidayNight");

    const monthsContainer =
      document.getElementById("months");

    const languageButton =
      document.getElementById(
        "languageButton"
      );


    /* =========================
       CREATE MONTHS
    ========================= */

    function createMonths() {

      monthsContainer.innerHTML = "";


      monthNames[currentLanguage].forEach(
        (month, index) => {

          const button =
            document.createElement("button");


          button.className =
            "month";


          button.textContent =
            month;


          if (
            selectedMonth === index
          ) {

            button.classList.add(
              "selected"
            );

          }


          button.addEventListener(
            "click",
            () => {

              if (
                selectedMonth === index
              ) {

                selectedMonth = null;

              } else {

                selectedMonth = index;

              }


              createMonths();

              update();

            }
          );


          monthsContainer.appendChild(
            button
          );

        }
      );

    }


    /* =========================
       APPLY LANGUAGE
    ========================= */

    function applyLanguage() {

      const t =
        translations[currentLanguage];


      document.documentElement.lang =
        currentLanguage === "ka"
          ? "ka"
          : "en";


      document.getElementById(
        "title"
      ).textContent =
        t.title;


      document.getElementById(
        "baseSalaryLabel"
      ).textContent =
        t.baseSalary;


      document.getElementById(
        "monthLabel"
      ).textContent =
        t.selectMonth;


      document.getElementById(
        "overtimeLabel"
      ).textContent =
        t.overtime;


      document.getElementById(
        "nightLabel"
      ).textContent =
        t.night;


      document.getElementById(
        "holidayLabel"
      ).textContent =
        t.holiday;


      document.getElementById(
        "holidayNightLabel"
      ).textContent =
        t.holidayNight;


      document.getElementById(
        "clearButton"
      ).textContent =
        t.clearHours;


      document.getElementById(
        "summaryBase"
      ).textContent =
        t.summaryBase;


      document.getElementById(
        "summaryExtra"
      ).textContent =
        t.summaryExtra;


      document.getElementById(
        "summaryTotal"
      ).textContent =
        t.summaryTotal;


      document.getElementById(
        "scheduledHoursLabel"
      ).textContent =
        t.scheduledHours;


      document.getElementById(
        "hourlySalaryLabel"
      ).textContent =
        t.hourlySalary;


      document.getElementById(
        "breakdownTitle"
      ).textContent =
        t.breakdown;


      document.getElementById(
        "overtimePayLabel"
      ).textContent =
        t.overtimePay;


      document.getElementById(
        "nightPayLabel"
      ).textContent =
        t.nightPay;


      document.getElementById(
        "holidayPayLabel"
      ).textContent =
        t.holidayPay;


      document.getElementById(
        "holidayNightPayLabel"
      ).textContent =
        t.holidayNightPay;


      document.getElementById(
        "extraTotalLabel"
      ).textContent =
        t.extraTotal;


      languageButton.textContent =
        t.languageButton;


      createMonths();

      update();

    }


    /* =========================
       LANGUAGE SWITCH
    ========================= */

    languageButton.addEventListener(
      "click",
      () => {

        languageButton.classList.remove(
          "animate"
        );


        /*
          Force animation restart
        */

        void languageButton.offsetWidth;


        languageButton.classList.add(
          "animate"
        );


        currentLanguage =
          currentLanguage === "en"
            ? "ka"
            : "en";


        localStorage.setItem(
          "salaryCalculatorLanguage",
          currentLanguage
        );


        applyLanguage();

      }
    );


    languageButton.addEventListener(
      "animationend",
      () => {

        languageButton.classList.remove(
          "animate"
        );

      }
    );


    /* =========================
       CALCULATION
    ========================= */

    function update() {

      const salary =
        Number(
          salaryInput.value
        );


      /*
        No month selected
      */

      if (
        selectedMonth === null
      ) {

        document.getElementById(
          "baseValue"
        ).textContent =
          salary.toFixed(2) +
          " GEL";


        document.getElementById(
          "extraValue"
        ).textContent =
          "0.00 GEL";


        document.getElementById(
          "totalValue"
        ).textContent =
          salary.toFixed(2) +
          " GEL";


        document.getElementById(
          "scheduledHoursValue"
        ).textContent =
          "—";


        document.getElementById(
          "hourlySalaryValue"
        ).textContent =
          "—";


        document.getElementById(
          "overtimePayValue"
        ).textContent =
          "0.00 GEL";


        document.getElementById(
          "nightPayValue"
        ).textContent =
          "0.00 GEL";


        document.getElementById(
          "holidayPayValue"
        ).textContent =
          "0.00 GEL";


        document.getElementById(
          "holidayNightPayValue"
        ).textContent =
          "0.00 GEL";


        document.getElementById(
          "extraTotalValue"
        ).textContent =
          "0.00 GEL";


        return;

      }


      /* Selected month */

      const monthHours =
        scheduledHours[
          selectedMonth
        ];


      const hourlySalary =
        salary / monthHours;


      /* Extra hours */

      const overtime =
        Number(
          overtimeInput.value
        ) || 0;


      const night =
        Number(
          nightInput.value
        ) || 0;


      const holiday =
        Number(
          holidayInput.value
        ) || 0;


      const holidayNight =
        Number(
          holidayNightInput.value
        ) || 0;


      /* Extra payments */

      const overtimePay =
        hourlySalary *
        overtime *
        2;


      const nightPay =
        hourlySalary *
        night *
        1.4;


      const holidayPay =
        hourlySalary *
        holiday *
        1.25;


      const holidayNightPay =
        hourlySalary *
        holidayNight *
        1.5;


      const extra =
        overtimePay +
        nightPay +
        holidayPay +
        holidayNightPay;


      const total =
        salary + extra;


      /* Summary */

      document.getElementById(
        "baseValue"
      ).textContent =
        salary.toFixed(2) +
        " GEL";


      document.getElementById(
        "extraValue"
      ).textContent =
        extra.toFixed(2) +
        " GEL";


      document.getElementById(
        "totalValue"
      ).textContent =
        total.toFixed(2) +
        " GEL";


      /* Basic information */

      document.getElementById(
        "scheduledHoursValue"
      ).textContent =
        monthHours + " h";


      document.getElementById(
        "hourlySalaryValue"
      ).textContent =
        hourlySalary.toFixed(2) +
        " GEL";


      /* Breakdown */

      document.getElementById(
        "overtimePayValue"
      ).textContent =
        overtimePay.toFixed(2) +
        " GEL";


      document.getElementById(
        "nightPayValue"
      ).textContent =
        nightPay.toFixed(2) +
        " GEL";


      document.getElementById(
        "holidayPayValue"
      ).textContent =
        holidayPay.toFixed(2) +
        " GEL";


      document.getElementById(
        "holidayNightPayValue"
      ).textContent =
        holidayNightPay.toFixed(2) +
        " GEL";


      document.getElementById(
        "extraTotalValue"
      ).textContent =
        extra.toFixed(2) +
        " GEL";

    }


    /* =========================
       SALARY CHANGE
    ========================= */

    salaryInput.addEventListener(
      "change",
      update
    );


    /* =========================
       HOUR INPUTS
    ========================= */

    document.querySelectorAll(
      "#overtime, #night, #holiday, #holidayNight"
    ).forEach(
      input => {


        /*
          Hide zero when focused
        */

        input.addEventListener(
          "focus",
          function() {

            if (
              this.value === "0"
            ) {

              this.value = "";

            }

          }
        );


        /*
          Restore zero on blur
        */

        input.addEventListener(
          "blur",
          function() {

            if (
              this.value === ""
            ) {

              this.value = "0";

            }


            update();

          }
        );


        input.addEventListener(
          "input",
          update
        );

      }
    );


    /* =========================
       CLEAR HOURS
    ========================= */

    document.getElementById(
      "clearButton"
    ).addEventListener(
      "click",
      () => {

        overtimeInput.value =
          "0";

        nightInput.value =
          "0";

        holidayInput.value =
          "0";

        holidayNightInput.value =
          "0";


        update();

      }
    );


    /* =========================
       START
    ========================= */

    createMonths();

    applyLanguage();

    update();

  </script>

</body>
</html>
