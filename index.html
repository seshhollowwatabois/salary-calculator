<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#0b0f19">
  <link rel="manifest" href="manifest.webmanifest">

  <title>Salary Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #0b0f19;
    }

    body {
      margin: 0;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));

      background: #0b0f19;
      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      min-height: 100vh;
      overscroll-behavior-y: none;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    /* =========================================
       LANGUAGE BUTTON
    ========================================= */

    .language-button {
      position: absolute;
      top: 0;
      right: 0;

      border: none;
      border-radius: 10px;

      padding: 8px 10px;

      background: #222a3b;
      color: #ffffff;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .language-button:active {
      transform: scale(0.94);
    }

    /* =========================================
       TITLE
    ========================================= */

    h1 {
      text-align: center;

      margin: 0 0 22px;

      padding-top: 4px;
      padding-right: 70px;
      padding-left: 70px;

      font-size: 28px;
      line-height: 1.2;

      font-weight: 750;
    }

    /* =========================================
       CARDS
    ========================================= */

    .card {
      background: #151b29;

      border-radius: 18px;

      padding: 18px;

      margin-bottom: 16px;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.12);
    }

    /* =========================================
       LABELS
    ========================================= */

    .label {
      display: block;

      margin-bottom: 8px;

      font-weight: 600;
      font-size: 15px;
    }

    /* =========================================
       INPUTS
    ========================================= */

    select,
    input {
      width: 100%;

      min-height: 48px;

      padding: 12px 14px;

      border: 1px solid transparent;
      border-radius: 12px;

      background: #222a3b;
      color: #ffffff;

      font-size: 17px;

      outline: none;

      -webkit-appearance: none;
      appearance: none;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;
    }

    select:focus,
    input:focus {
      border-color: #009DE0;

      box-shadow:
        0 0 0 2px rgba(0, 157, 224, 0.18);
    }

    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button {
      margin: 0;
    }

    /* =========================================
       MONTHS
    ========================================= */

    .months {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 8px;
    }

    .months button {
      border: none;

      border-radius: 12px;

      min-height: 46px;

      padding: 10px 5px;

      background: #222a3b;
      color: #ffffff;

      font-size: 14px;
      font-weight: 500;

      cursor: pointer;

      transition:
        transform 0.12s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .months button:active {
      transform: scale(0.95);
    }

    .months button.active {
      background: #009DE0;

      color: #ffffff;

      box-shadow:
        0 0 14px rgba(0, 157, 224, 0.35);

      font-weight: 700;
    }

    .months button.active::before {
      content: "W";

      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 20px;
      height: 20px;

      margin-right: 5px;

      border-radius: 50%;

      background: #ffffff;
      color: #009DE0;

      font-weight: 800;
      font-size: 11px;

      vertical-align: middle;
    }

    /* =========================================
       EXTRA HOURS
    ========================================= */

    .extra-row {
      margin-bottom: 14px;
    }

    .extra-row:last-of-type {
      margin-bottom: 0;
    }

    /* =========================================
       CLEAR BUTTON
    ========================================= */

    .clear-btn {
      width: 100%;

      min-height: 46px;

      margin-top: 16px;

      padding: 12px;

      border: none;
      border-radius: 12px;

      background: #2b3448;
      color: #ffffff;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.12s ease,
        background 0.15s ease;
    }

    .clear-btn:active {
      transform: scale(0.98);
      background: #354158;
    }

    /* =========================================
       SUMMARY
    ========================================= */

    .summary {
      display: grid;
      gap: 10px;
    }

    .summary-row {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 15px;

      font-size: 15px;
    }

    .summary-total {
      margin-top: 8px;

      padding-top: 14px;

      border-top:
        1px solid #30394d;

      font-size: 20px;
      font-weight: 750;
    }

    /* =========================================
       RESULT CARD
    ========================================= */

    .month-result {
      background: #151b29;

      border-radius: 18px;

      padding: 18px;

      margin-bottom: 16px;

      animation:
        resultAppear 0.2s ease;
    }

    @keyframes resultAppear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .month-title {
      font-size: 22px;

      font-weight: 750;

      margin-bottom: 14px;
    }

    .result-row {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 15px;

      padding: 9px 0;

      font-size: 15px;
    }

    .hourly-row {
      color: #009DE0;

      font-weight: 650;
    }

    /* =========================================
       PAY BREAKDOWN
    ========================================= */

    .breakdown-title {
      margin-top: 18px;

      padding-top: 15px;

      border-top:
        1px solid #30394d;

      font-size: 17px;

      font-weight: 700;
    }

    .breakdown-row {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 15px;

      padding: 7px 0;

      color: #c7cfdf;

      font-size: 14px;
    }

    .breakdown-row span:last-child {
      color: #ffffff;
      font-weight: 600;
    }

    .extra-total {
      display: flex;

      justify-content: space-between;

      margin-top: 7px;

      padding-top: 10px;

      border-top:
        1px solid #30394d;

      font-weight: 700;
    }

    .result-total {
      margin-top: 8px;

      padding-top: 14px;

      border-top:
        1px solid #30394d;

      font-weight: 750;

      font-size: 19px;
    }

    /* =========================================
       SMALL PHONES
    ========================================= */

    @media (max-width: 400px) {

      body {
        padding:
          max(14px, env(safe-area-inset-top))
          max(14px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
      }

      h1 {
        font-size: 25px;

        padding-left: 60px;
        padding-right: 60px;
      }

      .language-button {
        font-size: 12px;
        padding: 7px 8px;
      }

      .card {
        padding: 16px;
      }

      .months button {
        min-height: 44px;
        font-size: 13px;
      }
    }

  </style>
</head>


<body>

<div class="container">

  <!-- LANGUAGE SWITCH -->

  <button
    id="languageButton"
    class="language-button"
    onclick="toggleLanguage()">

    🇬🇪 ქართული

  </button>


  <!-- TITLE -->

  <h1 id="title">
    💰 Salary Calculator 🍏
  </h1>


  <!-- SALARY -->

  <div class="card">

    <label
      class="label"
      id="salaryLabel"
      for="salary">

      Base Salary

    </label>


    <select id="salary">

      <option value="1300">
        1300 GEL
      </option>

      <option value="1435">
        1435 GEL
      </option>

      <option value="1800">
        1800 GEL
      </option>

    </select>

  </div>


  <!-- MONTH -->

  <div class="card">

    <div
      class="label"
      id="monthLabel">

      Select Month

    </div>


    <div
      class="months"
      id="months">
    </div>

  </div>


  <!-- EXTRA HOURS -->

  <div class="card">


    <!-- OVERTIME -->

    <div class="extra-row">

      <label
        class="label"
        id="overtimeLabel"
        for="overtime">

        ⏱️ Overtime ×2

      </label>


      <input
        id="overtime"
        type="number"
        inputmode="decimal"
        value="0"
        min="0">

    </div>


    <!-- NIGHT -->

    <div class="extra-row">

      <label
        class="label"
        id="nightLabel"
        for="night">

        🌙 Night Addition ×1.4

      </label>


      <input
        id="night"
        type="number"
        inputmode="decimal"
        value="0"
        min="0">

    </div>


    <!-- BANK HOLIDAY -->

    <div class="extra-row">

      <label
        class="label"
        id="holidayLabel"
        for="holiday">

        🏖️ Bank Holiday ×1.25

      </label>


      <input
        id="holiday"
        type="number"
        inputmode="decimal"
        value="0"
        min="0">

    </div>


    <!-- BANK HOLIDAY NIGHT -->

    <div class="extra-row">

      <label
        class="label"
        id="holidayNightLabel"
        for="holidayNight">

        🌙🏖️ Bank Holiday Night ×1.5

      </label>


      <input
        id="holidayNight"
        type="number"
        inputmode="decimal"
        value="0"
        min="0">

    </div>


    <!-- CLEAR -->

    <button
      class="clear-btn"
      id="clearButton"
      onclick="clearHours()">

      Clear Hours

    </button>

  </div>


  <!-- SUMMARY -->

  <div class="card">

    <div class="summary">


      <div class="summary-row">

        <span id="summaryBaseLabel">
          Base salary
        </span>

        <span id="summaryBase">
          0.00 GEL
        </span>

      </div>


      <div class="summary-row">

        <span id="summaryExtraLabel">
          Extra pay
        </span>

        <span id="summaryExtra">
          0.00 GEL
        </span>

      </div>


      <div class="summary-row summary-total">

        <span id="summaryTotalLabel">
          Gross total
        </span>

        <span id="summaryTotal">
          0.00 GEL
        </span>

      </div>

    </div>

  </div>


  <!-- DETAILED RESULT -->

  <div id="results"></div>

</div>


<script>

/* =========================================
   TRANSLATIONS
========================================= */

const translations = {

  en: {

    languageButton: "🇬🇪 ქართული",

    title: "💰 Salary Calculator 🍏",

    baseSalary: "Base Salary",

    selectMonth: "Select Month",

    overtime: "⏱️ Overtime ×2",

    night: "🌙 Night Addition ×1.4",

    holiday: "🏖️ Bank Holiday ×1.25",

    holidayNight: "🌙🏖️ Bank Holiday Night ×1.5",

    clearHours: "Clear Hours",

    summaryBase: "Base salary",

    summaryExtra: "Extra pay",

    summaryTotal: "Gross total",

    scheduledHours: "📅 Scheduled hours",

    hourlySalary: "💰 Hourly salary",

    breakdown: "📊 Pay Breakdown",

    overtimePay: "⏱️ Overtime",

    nightPay: "🌙 Night Addition",

    holidayPay: "🏖️ Bank Holiday",

    holidayNightPay: "🌙🏖️ Bank Holiday Night",

    extraTotal: "Extra Pay"

  },


  ka: {

    languageButton: "🇬🇧 English",

    title: "💰 ხელფასის კალკულატორი 🍏",

    baseSalary: "ძირითადი ხელფასი",

    selectMonth: "აირჩიეთ თვე",

    overtime: "⏱️ ზეგანაკვეთური ×2",

    night: "🌙 ღამის დანამატი ×1.4",

    holiday: "🏖️ სადღესასწაულო დღე ×1.25",

    holidayNight: "🌙🏖️ სადღესასწაულო ღამის ×1.5",

    clearHours: "საათების გასუფთავება",

    summaryBase: "ძირითადი ხელფასი",

    summaryExtra: "დამატებითი ანაზღაურება",

    summaryTotal: "მთლიანი ხელფასი",

    scheduledHours: "📅 დაგეგმილი საათები",

    hourlySalary: "💰 საათობრივი ხელფასი",

    breakdown: "📊 ანაზღაურების დეტალური გაშლა",

    overtimePay: "⏱️ ზეგანაკვეთური",

    nightPay: "🌙 ღამის დანამატი",

    holidayPay: "🏖️ სადღესასწაულო დღე",

    holidayNightPay: "🌙🏖️ სადღესასწაულო ღამის",

    extraTotal: "დამატებითი ანაზღაურება"

  }

};


/* =========================================
   MONTH NAMES
========================================= */

const monthNames = {

  en: [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
  ],

  ka: [
    "იანვარი",
    "თებერვალი",
    "მარტი",
    "აპრილი",
    "მაისი",
    "ივნისი",
    "ივლისი",
    "აგვისტო",
    "სექტემბერი",
    "ოქტომბერი",
    "ნოემბერი",
    "დეკემბერი"
  ]

};


/* =========================================
   2026 SCHEDULED HOURS
========================================= */

const scheduledHours = [

  168, // January
  160, // February
  184, // March
  176, // April
  168, // May
  176, // June
  176, // July
  176, // August
  176, // September
  168, // October
  176, // November
  184  // December

];


/* =========================================
   LANGUAGE
========================================= */

let currentLanguage =
  localStorage.getItem(
    "salaryCalculatorLanguage"
  ) || "en";


/* =========================================
   SELECTED MONTH
========================================= */

let selectedMonth = null;


/* =========================================
   MONTH CONTAINER
========================================= */

const monthsContainer =
  document.getElementById("months");


/* =========================================
   CREATE MONTH BUTTONS
========================================= */

function createMonthButtons() {

  monthsContainer.innerHTML = "";


  monthNames[currentLanguage].forEach(
    (month, index) => {

      const button =
        document.createElement("button");


      button.textContent =
        month.slice(0, 3);


      button.id =
        "month-" + index;


      button.addEventListener(
        "click",
        () => {

          toggleMonth(index);

        }
      );


      monthsContainer.appendChild(button);

    }
  );

}


/* =========================================
   MONTH TOGGLE
========================================= */

function toggleMonth(index) {

  if (selectedMonth === index) {

    selectedMonth = null;

  } else {

    selectedMonth = index;

  }


  update();

}


/* =========================================
   LANGUAGE TOGGLE
========================================= */

function toggleLanguage() {

  if (currentLanguage === "en") {

    currentLanguage = "ka";

  } else {

    currentLanguage = "en";

  }


  localStorage.setItem(
    "salaryCalculatorLanguage",
    currentLanguage
  );


  applyLanguage();

  update();

}


/* =========================================
   APPLY LANGUAGE
========================================= */

function applyLanguage() {

  const t =
    translations[currentLanguage];


  document.documentElement.lang =
    currentLanguage === "ka"
      ? "ka"
      : "en";


  document.getElementById(
    "languageButton"
  ).textContent =
    t.languageButton;


  document.getElementById(
    "title"
  ).textContent =
    t.title;


  document.getElementById(
    "salaryLabel"
  ).textContent =
    t.baseSalary;


  document.getElementById(
    "monthLabel"
  ).textContent =
    t.selectMonth;


  document.getElementById(
    "overtimeLabel"
  ).textContent =
    t.overtime;


  document.getElementById(
    "nightLabel"
  ).textContent =
    t.night;


  document.getElementById(
    "holidayLabel"
  ).textContent =
    t.holiday;


  document.getElementById(
    "holidayNightLabel"
  ).textContent =
    t.holidayNight;


  document.getElementById(
    "clearButton"
  ).textContent =
    t.clearHours;


  document.getElementById(
    "summaryBaseLabel"
  ).textContent =
    t.summaryBase;


  document.getElementById(
    "summaryExtraLabel"
  ).textContent =
    t.summaryExtra;


  document.getElementById(
    "summaryTotalLabel"
  ).textContent =
    t.summaryTotal;


  createMonthButtons();

}


/* =========================================
   CLEAR HOURS
========================================= */

function clearHours() {

  document.getElementById(
    "overtime"
  ).value = 0;


  document.getElementById(
    "night"
  ).value = 0;


  document.getElementById(
    "holiday"
  ).value = 0;


  document.getElementById(
    "holidayNight"
  ).value = 0;


  update();

}


/* =========================================
   ZERO DISAPPEARING
========================================= */

document.querySelectorAll(
  "#overtime, #night, #holiday, #holidayNight"
).forEach(input => {


  input.addEventListener(
    "focus",
    function() {

      if (this.value === "0") {

        this.value = "";

      }

    }
  );


  input.addEventListener(
    "blur",
    function() {

      if (this.value === "") {

        this.value = "0";

      }

      update();

    }
  );

});


/* =========================================
   LIVE UPDATE
========================================= */

document
  .querySelectorAll("input, select")
  .forEach(element => {

    element.addEventListener(
      "input",
      update
    );


    element.addEventListener(
      "change",
      update
    );

  });


/* =========================================
   MONEY
========================================= */

function money(value) {

  return value.toFixed(2) + " GEL";

}


/* =========================================
   MAIN CALCULATION
========================================= */

function update() {

  const salary =
    Number(
      document.getElementById("salary").value
    ) || 0;


  const overtime =
    Number(
      document.getElementById("overtime").value
    ) || 0;


  const night =
    Number(
      document.getElementById("night").value
    ) || 0;


  const holiday =
    Number(
      document.getElementById("holiday").value
    ) || 0;


  const holidayNight =
    Number(
      document.getElementById("holidayNight").value
    ) || 0;


  /* Active month */

  document
    .querySelectorAll(".months button")
    .forEach((button, index) => {

      button.classList.toggle(
        "active",
        selectedMonth === index
      );

    });


  /* No month */

  if (selectedMonth === null) {

    document.getElementById(
      "summaryBase"
    ).textContent =
      "0.00 GEL";


    document.getElementById(
      "summaryExtra"
    ).textContent =
      "0.00 GEL";


    document.getElementById(
      "summaryTotal"
    ).textContent =
      "0.00 GEL";


    document.getElementById(
      "results"
    ).innerHTML = "";


    return;

  }


  /* Month hours */

  const monthHours =
    scheduledHours[selectedMonth];


  /* Hourly salary */

  const hourlySalary =
    salary / monthHours;


  /* Individual payments */

  const overtimePay =
    hourlySalary *
    overtime *
    2;


  const nightPay =
    hourlySalary *
    night *
    1.4;


  const holidayPay =
    hourlySalary *
    holiday *
    1.25;


  const holidayNightPay =
    hourlySalary *
    holidayNight *
    1.5;


  /* Total extra */

  const extra =
    overtimePay +
    nightPay +
    holidayPay +
    holidayNightPay;


  /* Gross */

  const total =
    salary + extra;


  /* Summary */

  document.getElementById(
    "summaryBase"
  ).textContent =
    money(salary);


  document.getElementById(
    "summaryExtra"
  ).textContent =
    money(extra);


  document.getElementById(
    "summaryTotal"
  ).textContent =
    money(total);


  /* Translation */

  const t =
    translations[currentLanguage];


  const month =
    monthNames[currentLanguage][selectedMonth];


  /* Detailed result */

  document.getElementById(
    "results"
  ).innerHTML = `

    <div class="month-result">

      <div class="month-title">
        ${month}
      </div>


      <div class="result-row">

        <span>
          ${t.scheduledHours}
        </span>

        <span>
          ${monthHours} h
        </span>

      </div>


      <div class="result-row hourly-row">

        <span>
          ${t.hourlySalary}
        </span>

        <span>
          ${money(hourlySalary)} / h
        </span>

      </div>


      <div class="result-row">

        <span>
          ${t.summaryBase}
        </span>

        <span>
          ${money(salary)}
        </span>

      </div>


      <!-- PAY BREAKDOWN -->

      <div class="breakdown-title">

        ${t.breakdown}

      </div>


      <div class="breakdown-row">

        <span>
          ${t.overtimePay}
        </span>

        <span>
          ${money(overtimePay)}
        </span>

      </div>


      <div class="breakdown-row">

        <span>
          ${t.nightPay}
        </span>

        <span>
          ${money(nightPay)}
        </span>

      </div>


      <div class="breakdown-row">

        <span>
          ${t.holidayPay}
        </span>

        <span>
          ${money(holidayPay)}
        </span>

      </div>


      <div class="breakdown-row">

        <span>
          ${t.holidayNightPay}
        </span>

        <span>
          ${money(holidayNightPay)}
        </span>

      </div>


      <div class="extra-total">

        <span>
          ${t.extraTotal}
        </span>

        <span>
          ${money(extra)}
        </span>

      </div>


      <div class="result-row result-total">

        <span>
          ${t.summaryTotal}
        </span>

        <span>

  `;

}
