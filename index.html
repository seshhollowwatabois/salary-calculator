<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#009DE0">

  <link rel="manifest" href="manifest.webmanifest">

  <title>Salary Calculator</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #0b0f19;
      color: #ffffff;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px 16px 40px;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 30px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 24px;
    }

    .card {
      background: #151b29;
      border: 1px solid #252d3d;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #aeb6c5;
      margin-bottom: 8px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;

      border-radius: 12px;
      border: 1px solid #374151;

      background: #0f1420;
      color: white;

      font-size: 16px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #009DE0;

      box-shadow:
        0 0 0 2px rgba(0, 157, 224, 0.15);
    }

    .months {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;
    }

    button {
      border: 0;

      border-radius: 12px;

      padding: 13px 10px;

      background: #222a3a;

      color: white;

      font-size: 14px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button.active {
      background: #009DE0;

      color: #ffffff;

      box-shadow:
        0 0 12px rgba(0, 157, 224, 0.35);

      font-weight: 600;
    }

    /*
      W badge
    */

    button.active::before {
      content: "W";

      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 20px;
      height: 20px;

      margin-right: 6px;

      border-radius: 50%;

      background: #ffffff;

      color: #009DE0;

      font-weight: 800;

      font-size: 12px;

      vertical-align: middle;
    }

    .hours-grid {
      display: grid;
      gap: 12px;
    }

    .hour-label {
      color: #ffffff;

      font-size: 14px;

      margin-bottom: 8px;
    }

    /*
      Summary
    */

    .summary {
      background:
        linear-gradient(
          135deg,
          #009DE0,
          #0077b6
        );

      border-radius: 18px;

      padding: 20px;

      margin-bottom: 16px;
    }

    .summary-row {
      display: flex;

      justify-content: space-between;

      margin: 9px 0;
    }

    .total {
      font-size: 25px;

      font-weight: 700;

      margin-top: 14px;

      padding-top: 14px;

      border-top:
        1px solid rgba(255,255,255,.3);
    }

    /*
      Month result
    */

    .month-result {
      background: #151b29;

      border: 1px solid #252d3d;

      border-radius: 16px;

      padding: 16px;

      margin-bottom: 12px;
    }

    .month-title {
      font-size: 19px;

      font-weight: 700;

      margin-bottom: 12px;
    }

    .result-row {
      display: flex;

      justify-content: space-between;

      color: #cbd5e1;

      margin: 8px 0;
    }

    .hourly-row {
      color: #ffffff;

      font-weight: 600;
    }

    .result-total {
      color: white;

      font-weight: 700;

      margin-top: 10px;

      padding-top: 10px;

      border-top:
        1px solid #2b3445;
    }

    .note {
      color: #8f9bad;

      font-size: 12px;

      line-height: 1.5;

      margin-top: 12px;
    }

    .clear {
      width: 100%;

      background: #252d3d;

      margin-top: 10px;
    }

    .clear:hover {
      background: #30394c;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    Salary Calculator
  </h1>


  <div class="subtitle">
    Calculate your monthly salary and extra payments.
  </div>


  <!-- BASE SALARY -->

  <div class="card">

    <label>
      Base salary
    </label>

    <select id="salary">

      <option value="1300">
        1,300 GEL
      </option>

      <option value="1435">
        1,435 GEL
      </option>

      <option value="1800">
        1,800 GEL
      </option>

    </select>

  </div>


  <!-- MONTH SELECTION -->

  <div class="card">

    <label>
      Select month
    </label>

    <div
      class="months"
      id="months">
    </div>

  </div>


  <!-- EXTRA HOURS -->

  <div class="card">

    <label>
      Extra hours
    </label>


    <div class="hours-grid">


      <!-- OVERTIME -->

      <div>

        <label class="hour-label">
          ⏱️ Overtime ×2
        </label>

        <input
          id="overtime"
          type="number"
          min="0"
          step="0.5"
          value="0"
        >

      </div>


      <!-- NIGHT -->

      <div>

        <label class="hour-label">
          🌙 Night Addition ×1.4
        </label>

        <input
          id="night"
          type="number"
          min="0"
          step="0.5"
          value="0"
        >

      </div>


      <!-- BANK HOLIDAY -->

      <div>

        <label class="hour-label">
          🏖️ Bank Holiday ×1.25
        </label>

        <input
          id="holiday"
          type="number"
          min="0"
          step="0.5"
          value="0"
        >

      </div>


      <!-- BANK HOLIDAY NIGHT -->

      <div>

        <label class="hour-label">
          🌙🏖️ Bank Holiday Night ×1.5
        </label>

        <input
          id="holidayNight"
          type="number"
          min="0"
          step="0.5"
          value="0"
        >

      </div>


    </div>


    <button
      class="clear"
      onclick="clearHours()"
    >
      Clear hours
    </button>

  </div>


  <!-- SUMMARY -->

  <div class="summary">


    <div class="summary-row">

      <span>
        Base salary
      </span>

      <strong id="summaryBase">
        0.00 GEL
      </strong>

    </div>


    <div class="summary-row">

      <span>
        Extra pay
      </span>

      <strong id="summaryExtra">
        0.00 GEL
      </strong>

    </div>


    <div class="summary-row total">

      <span>
        Gross total
      </span>

      <strong id="summaryTotal">
        0.00 GEL
      </strong>

    </div>


  </div>


  <!-- MONTH RESULT -->

  <div id="results"></div>


  <div class="note">

    Premium calculation uses the selected
    month's hourly salary × the applicable
    multiplier.

    Monthly hourly salary =
    base salary ÷ scheduled monthly hours.

  </div>


</div>



<script>


/*
  MONTH NAMES
*/

const monthNames = [

  "January",
  "February",
  "March",
  "April",
  "May",
  "June",
  "July",
  "August",
  "September",
  "October",
  "November",
  "December"

];



/*
  2026 SCHEDULED HOURS
*/

const scheduledHours = [

  168, // January
  160, // February
  184, // March
  176, // April
  168, // May
  176, // June
  176, // July
  176, // August
  176, // September
  168, // October
  176, // November
  184  // December

];



/*
  MONTH BUTTON CONTAINER
*/

const monthsContainer =
  document.getElementById("months");



/*
  Currently selected month.

  null = no month selected.
*/

let selectedMonth = null;



/*
  CREATE MONTH BUTTONS
*/

monthNames.forEach(
  (month, index) => {

    const button =
      document.createElement("button");


    button.textContent =
      month.slice(0, 3);


    button.id =
      "month-" + index;


    /*
      IMPORTANT:

      Clicking a month immediately
      runs the calculator again.
    */

    button.addEventListener(
      "click",
      () => {

        toggleMonth(index);

      }
    );


    monthsContainer.appendChild(button);

  }
);



/*
  SELECT / DESELECT MONTH
*/

function toggleMonth(index) {


  /*
    If the currently selected month
    is pressed again, deselect it.
  */

  if (
    selectedMonth === index
  ) {

    selectedMonth = null;

  }


  /*
    Otherwise select the new month.
  */

  else {

    selectedMonth = index;

  }


  /*
    Immediately recalculate.

    This is the important part.
  */

  update();

}



/*
  CLEAR HOURS
*/

function clearHours() {

  document.getElementById(
    "overtime"
  ).value = 0;


  document.getElementById(
    "night"
  ).value = 0;


  document.getElementById(
    "holiday"
  ).value = 0;


  document.getElementById(
    "holidayNight"
  ).value = 0;


  /*
    Recalculate immediately.
  */

  update();

}



/*
  LISTEN FOR INPUT CHANGES
*/

document
  .querySelectorAll(
    "input, select"
  )
  .forEach(
    element => {


      /*
        Fires while typing.
      */

      element.addEventListener(
        "input",
        update
      );


      /*
        Also fires when selecting
        a different salary.
      */

      element.addEventListener(
        "change",
        update
      );

    }
  );



/*
  FORMAT MONEY
*/

function money(value) {

  return (
    value.toFixed(2)
    + " GEL"
  );

}



/*
  MAIN CALCULATOR
*/

function update() {


  /*
    Get current salary
  */

  const salary =
    Number(
      document.getElementById(
        "salary"
      ).value
    ) || 0;



  /*
    Get current overtime hours
  */

  const overtime =
    Number(
      document.getElementById(
        "overtime"
      ).value
    ) || 0;



  /*
    Get current night hours
  */

  const night =
    Number(
      document.getElementById(
        "night"
      ).value
    ) || 0;



  /*
    Get current bank holiday hours
  */

  const holiday =
    Number(
      document.getElementById(
        "holiday"
      ).value
    ) || 0;



  /*
    Get current bank holiday night hours
  */

  const holidayNight =
    Number(
      document.getElementById(
        "holidayNight"
      ).value
    ) || 0;



  /*
    UPDATE MONTH BUTTONS
  */

  document
    .querySelectorAll(
      ".months button"
    )
    .forEach(
      (button, index) => {

        button.classList.toggle(
          "active",
          selectedMonth === index
        );

      }
    );



  /*
    IF NO MONTH IS SELECTED
  */

  if (
    selectedMonth === null
  ) {


    document.getElementById(
      "summaryBase"
    ).textContent =
      "0.00 GEL";


    document.getElementById(
      "summaryExtra"
    ).textContent =
      "0.00 GEL";


    document.getElementById(
      "summaryTotal"
    ).textContent =
      "0.00 GEL";


    document.getElementById(
      "results"
    ).innerHTML =
      "";


    return;

  }



  /*
    GET THE CURRENT MONTH'S
    SCHEDULED HOURS
  */

  const monthHours =
    scheduledHours[
      selectedMonth
    ];



  /*
    CALCULATE HOURLY SALARY

    Example:

    January:
    1300 ÷ 168 = 7.74

    February:
    1300 ÷ 160 = 8.13

    March:
    1300 ÷ 184 = 7.07
  */

  const hourlySalary =
    salary / monthHours;



  /*
    EXTRA PAY CALCULATIONS

    IMPORTANT:

    We use the CURRENT MONTH'S
    hourly salary.

    Therefore changing the month
    automatically changes the result.
  */


  const overtimePay =
    hourlySalary
    * overtime
    * 2;



  const nightPay =
    hourlySalary
    * night
    * 1.4;



  const holidayPay =
    hourlySalary
    * holiday
    * 1.25;



  const holidayNightPay =
    hourlySalary
    * holidayNight
    * 1.5;



  /*
    TOTAL EXTRA PAY
  */

  const extra =
    overtimePay
    + nightPay
    + holidayPay
    + holidayNightPay;



  /*
    GROSS TOTAL
  */

  const total =
    salary + extra;



  /*
    UPDATE SUMMARY
  */

  document.getElementById(
    "summaryBase"
  ).textContent =
    money(salary);



  document.getElementById(
    "summaryExtra"
  ).textContent =
    money(extra);



  document.getElementById(
    "summaryTotal"
  ).textContent =
    money(total);



  /*
    UPDATE MONTH RESULT
  */

  document.getElementById(
    "results"
  ).innerHTML = `

    <div class="month-result">


      <div class="month-title">

        ${monthNames[selectedMonth]}

      </div>


      <div class="result-row">

        <span>
          📅 Scheduled hours
        </span>

        <span>
          ${monthHours} h
        </span>

      </div>


      <div class="result-row hourly-row">

        <span>
          💰 Hourly salary
        </span>

        <span>
          ${money(hourlySalary)} / h
        </span>

      </div>


      <div class="result-row">

        <span>
          Base salary
        </span>

        <span>
          ${money(salary)}
        </span>

      </div>


      <div class="result-row">

        <span>
          Extra pay
        </span>

        <span>
          ${money(extra)}
        </span>

      </div>


      <div class="result-row result-total">

        <span>
          Gross total
        </span>

        <span>
          ${money(total)}
        </span>

      </div>


    </div>

  `;

}



/*
  RUN CALCULATOR ON PAGE LOAD
*/

update();

</script>


</body>
</html>
